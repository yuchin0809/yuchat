# ゆうダービー 自動開催
# 毎日 11:30 と 15:02（日本時間）の2レースを、誰もサイトを開いていなくても開催・精算する。
#
# GitHub の定期実行は予定より15〜20分ほど遅れて始まる（実測）。そのため
#   ・開催時刻より前に起動し、プログラムの中で開催時刻（11:30:00 / 15:02:00）まで待ってから開催する（DERBY_WAIT_FOR_RACE）
#   ・開催時刻の後にも予備の実行を入れ、失敗や大きな遅れがあっても後から必ず開催・精算する
# 何回実行されても、Firestore のトランザクションで「まだ無ければ作る」「未精算なら精算する」ので二重にはならない。
# 締切（11:20 / 14:52）より前に結果を作ることはない（早く起動しても開催時刻まで待つ）。
# 待つ前に、すでに過ぎた回（例：15:02 を待つ間の 11:30）があれば先に開催・精算する。
#
# cron は UTC（日本時間 = UTC + 9時間。日本に夏時間は無いので一年中この差のまま）。
# 混み合う毎時0分付近を避けた時刻にしている。
#
# 必要な設定：リポジトリの Settings → Secrets and variables → Actions に
#   FIREBASE_SERVICE_ACCOUNT（Firebase のサービスアカウントの鍵 JSON）を登録する。
# 未登録のあいだは警告を出して何もしない。

name: ゆうダービー自動開催

on:
  pull_request:
    paths:
      - "derby-runner/**"
      - "derby-odds.js"
      - ".github/workflows/derby-runner.yml"
  schedule:
    - cron: "41 1 * * *"   # 10:41 JST 起動 → 11:30 まで待って開催
    - cron: "5 2 * * *"    # 11:05 JST 起動 → 11:30 まで待って開催（上の実行が遅れた・失敗したときの保険）
    - cron: "39 2 * * *"   # 11:39 JST 予備（11:30 の開催・精算の確認）
    - cron: "41 3 * * *"   # 12:41 JST 起動 → 13:00 まで待って1日1回の処理（株価・利息・総資産ランキング）。11:30 の予備も兼ねる
    - cron: "13 5 * * *"   # 14:13 JST 起動 → 15:02 まで待って開催
    - cron: "37 5 * * *"   # 14:37 JST 起動 → 15:02 まで待って開催（上の実行が遅れた・失敗したときの保険）
    - cron: "11 6 * * *"   # 15:11 JST 予備（開催・精算の確認）
    - cron: "47 6 * * *"   # 15:47 JST 予備
    - cron: "19 9 * * *"   # 18:19 JST 予備
    - cron: "23 14 * * *"  # 23:23 JST 予備（その日のうちの最後の確認）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # プルリクエストでは、締切後・不正な馬券を払わない／サーバー以外のレース結果を信用しない、の検証テストだけ実行する（鍵は不要）
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: derby-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "*.test.mjs"

  run:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: derby-runner
    steps:
      - uses: actions/checkout@v4

      - name: 鍵が登録されているか確認
        id: secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT が未登録のため、自動開催をスキップしました"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ready == 'true'
        with:
          node-version: 22

      - name: 依存パッケージのインストール
        if: steps.secret.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: レースの開催・精算
        if: steps.secret.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # ゆう株の株価・ニュースの乱数に使う秘密値（公開リポジトリから翌日の株価を計算されないように）。
          # 未登録のときは、サービスアカウントの鍵から作った値を使う（鍵そのものは使わない）
          STOCK_SEED_SECRET: ${{ secrets.STOCK_SEED_SECRET }}
          DERBY_WAIT_FOR_RACE: "1"
        run: node run.mjs
