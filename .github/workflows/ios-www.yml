# アプリ用の画面（賭けの機能を入れない版）の書き出しが壊れていないかの確認。サイトのファイルを変えたときに動く
name: アプリ用の画面の確認

on:
  pull_request:
    paths: ["*.js", "*.html", "*.css", "ios-app/**"]
  push:
    branches: [main]
    paths: ["*.js", "*.html", "*.css", "ios-app/**"]

jobs:
  www:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test ios-app/test/build-www.test.mjs
      - run: node ios-app/build-www.mjs "$RUNNER_TEMP/www"
