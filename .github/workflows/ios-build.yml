name: iPhoneアプリ（ビルドして App Store Connect へ送る）

# 手で動かすときだけ動く。Mac が無くても、GitHub の macOS で作る（公開リポジトリは無料）。
# 必要な鍵（Settings → Secrets and variables → Actions に登録）：
#   ASC_KEY_ID      … App Store Connect の API キーの「キー ID」
#   ASC_ISSUER_ID   … 同じ画面の「Issuer ID」
#   ASC_KEY_P8      … ダウンロードした .p8 ファイルの中身（-----BEGIN PRIVATE KEY----- から全部）
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect へ送る（false なら、ビルドの確認だけ）"
        type: boolean
        default: true

permissions:
  contents: read

env:
  TEAM_ID: QAQ2VTWZCF
  BUNDLE_ID: jp.yuchat.app

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: 鍵が登録されているか確認
        env: { K1: "${{ secrets.ASC_KEY_ID }}", K2: "${{ secrets.ASC_ISSUER_ID }}", K3: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          for v in K1 K2 K3; do [ -n "${!v}" ] || { echo "::error::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 のどれかが未登録です"; exit 1; }; done

      - name: Capacitor を入れて、iOS のプロジェクトを作る
        working-directory: ios-app
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios

      - name: アイコン（1024px・透明なし）と、Info.plist の説明文
        working-directory: ios-app
        run: |
          set -e
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sips -z 1024 1024 ../icons/icon-512.png --out /tmp/i.png
          sips -s format jpeg /tmp/i.png --out /tmp/i.jpg      # 透明を無くす（App Store は透明のアイコンを断る）
          sips -s format png /tmp/i.jpg --out "$ICON"
          P=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "Delete :$1" "$P" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$P"; }
          pb NSCameraUsageDescription string "YuSnap の写真を撮るために、カメラを使います。"
          pb NSPhotoLibraryUsageDescription string "チャットに送る写真を選ぶために、写真を使います。"
          pb NSMicrophoneUsageDescription string "カメラの利用にあわせて、マイクの許可を求められることがあります。録音はしません。"
          pb ITSAppUsesNonExemptEncryption bool false
          cat "$P" | head -50

      - name: 鍵のファイルを作る
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          mkdir -p "$RUNNER_TEMP/k"; printf '%s\n' "$P8" > "$RUNNER_TEMP/k/AuthKey.p8"; chmod 600 "$RUNNER_TEMP/k/AuthKey.p8"

      - name: ビルド（archive）
        working-directory: ios-app/ios/App
        env: { KEY_ID: "${{ secrets.ASC_KEY_ID }}", ISSUER: "${{ secrets.ASC_ISSUER_ID }}" }
        run: |
          WS=App.xcworkspace; [ -d "$WS" ] || WS=""
          if [ -n "$WS" ]; then TARGET=(-workspace "$WS"); else TARGET=(-project App.xcodeproj); fi
          xcodebuild "${TARGET[@]}" -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/k/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive

      - name: 書き出して App Store Connect へ送る
        if: ${{ inputs.upload }}
        env: { KEY_ID: "${{ secrets.ASC_KEY_ID }}", ISSUER: "${{ secrets.ASC_ISSUER_ID }}" }
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/out" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/k/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"

      - name: 鍵のファイルを消す
        if: always()
        run: rm -rf "$RUNNER_TEMP/k"
