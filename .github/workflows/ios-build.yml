name: iPhoneアプリ（ビルドして App Store Connect へ送る）

# 手で動かすときだけ動く。Mac が無くても、GitHub の macOS で作る（公開リポジトリは無料）。
# 必要な鍵（Settings → Secrets and variables → Actions に登録）：
#   ASC_KEY_ID      … App Store Connect の API キーの「キー ID」
#   ASC_ISSUER_ID   … 同じ画面の「Issuer ID」
#   ASC_KEY_P8      … ダウンロードした .p8 ファイルの中身（-----BEGIN PRIVATE KEY----- から全部）
#   IOS_GOOGLE_SERVICE_INFO_PLIST … Firebase の iOS アプリの GoogleService-Info.plist の中身（通知用）
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect へ送る（false なら、ビルドの確認だけ）"
        type: boolean
        default: true

permissions:
  contents: read

env:
  TEAM_ID: QAQ2VTWZCF
  BUNDLE_ID: jp.yuchat.app

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: 鍵が登録されているか確認
        env: { K1: "${{ secrets.ASC_KEY_ID }}", K2: "${{ secrets.ASC_ISSUER_ID }}", K3: "${{ secrets.ASC_KEY_P8 }}", K4: "${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}" }
        run: |
          for v in K1 K2 K3 K4; do [ -n "${!v}" ] || { echo "::error::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 / IOS_GOOGLE_SERVICE_INFO_PLIST のどれかが未登録です"; exit 1; }; done

      - name: Xcode 26 を使う（App Store は iOS 26 SDK 以降でないと受け付けない）
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Capacitor を入れて、iOS のプロジェクトを作る
        working-directory: ios-app
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios

      - name: 通知の設定（Firebase の設定ファイル・通知の権限・AppDelegate）
        working-directory: ios-app
        env: { PLIST: "${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}" }
        run: |
          set -e
          printf '%s\n' "$PLIST" > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
          cat > ios/App/App/App.entitlements <<'EN'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>
          EN
          # Xcode のプロジェクトに、設定ファイルと権限ファイルを足す（App の部分だけ。Pods の部品には付けない）
          ruby -e '
            require "xcodeproj"
            pr = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            t = pr.targets.find { |x| x.name == "App" }
            grp = pr.main_group.find_subpath("App", true)
            f = grp.new_file("GoogleService-Info.plist"); t.resources_build_phase.add_file_reference(f)
            grp.new_file("App.entitlements")
            t.build_configurations.each { |c| c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements" }
            pr.save
          '
          python3 - <<'PY'
          import re
          p = "ios/App/App/AppDelegate.swift"
          s = open(p).read()
          if "import FirebaseCore" not in s: s = s.replace("import UIKit", "import UIKit\nimport FirebaseCore\nimport FirebaseMessaging", 1)
          s = s.replace("didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {", "didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {\n        FirebaseApp.configure()", 1)
          s = s.replace("NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)", "Messaging.messaging().apnsToken = deviceToken\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)", 1)
          assert "FirebaseApp.configure()" in s and "apnsToken" in s, "AppDelegate を書き換えられませんでした"
          open(p, "w").write(s)
          PY
          sed -n 1,60p ios/App/App/AppDelegate.swift

      - name: アイコン（1024px・透明なし）と、Info.plist の説明文
        working-directory: ios-app
        run: |
          set -e
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sips -z 1024 1024 ../icons/icon-512.png --out /tmp/i.png
          sips -s format jpeg /tmp/i.png --out /tmp/i.jpg      # 透明を無くす（App Store は透明のアイコンを断る）
          sips -s format png /tmp/i.jpg --out "$ICON"
          P=ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "Delete :$1" "$P" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$P"; }
          pb NSCameraUsageDescription string "YuSnap の写真を撮るために、カメラを使います。"
          pb NSPhotoLibraryUsageDescription string "チャットに送る写真を選ぶために、写真を使います。"
          pb NSMicrophoneUsageDescription string "カメラの利用にあわせて、マイクの許可を求められることがあります。録音はしません。"
          pb ITSAppUsesNonExemptEncryption bool false
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$P"
          cat "$P" | head -50

      - name: 鍵のファイルを作る
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          mkdir -p "$RUNNER_TEMP/k"; printf '%s\n' "$P8" > "$RUNNER_TEMP/k/AuthKey.p8"; chmod 600 "$RUNNER_TEMP/k/AuthKey.p8"

      - name: ビルド（archive・署名は、次の書き出しでする。開発用の端末が無くても通すため）
        working-directory: ios-app/ios/App
        env: { KEY_ID: "${{ secrets.ASC_KEY_ID }}", ISSUER: "${{ secrets.ASC_ISSUER_ID }}" }
        run: |
          WS=App.xcworkspace; [ -d "$WS" ] || WS=""
          if [ -n "$WS" ]; then TARGET=(-workspace "$WS"); else TARGET=(-project App.xcodeproj); fi
          xcodebuild "${TARGET[@]}" -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive

      - name: 書き出して App Store Connect へ送る
        if: ${{ inputs.upload }}
        env: { KEY_ID: "${{ secrets.ASC_KEY_ID }}", ISSUER: "${{ secrets.ASC_ISSUER_ID }}" }
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/out" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/k/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"

      - name: 鍵のファイルを消す
        if: always()
        run: rm -rf "$RUNNER_TEMP/k"
