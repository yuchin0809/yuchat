# ゆうChat 通知サーバー（Cloudflare Workers）
# 公開は GitHub Actions（.github/workflows/notify-worker.yml）が main へのマージで自動で行う
#   （手で公開する場合：npx wrangler deploy）
# 鍵（FIREBASE_SERVICE_ACCOUNT）は Cloudflare の Secret に登録済み。wrangler deploy は Secret を変更しない
#   （登録し直す場合：npx wrangler secret put FIREBASE_SERVICE_ACCOUNT）

name = "yuuchat-notify"
main = "worker.js"
# 互換日付・プレビュー URL・ログ（下の [observability]）は Cloudflare の管理画面の設定に合わせている（公開のたびに管理画面の設定を上書きしないように）
compatibility_date = "2026-10-05"
preview_urls = false

# worker.js は外部ライブラリを使わない1ファイルなので、まとめ直さずにそのまま公開する
# （公開中のコードとリポジトリの worker.js を、そのまま比べられるようにするため）
no_bundle = true

# Cloudflare の管理画面で設定した変数（Text）を、公開のときに消さない
keep_vars = true

[vars]
FIREBASE_PROJECT_ID = "yuuchat-be666"
ALLOWED_ORIGINS = "https://yuchin0809.github.io"

# 毎分：ゆうダービー開始1分前の通知を確かめる（worker.js の scheduled → notifyDerbyStartingSoon）
# 自動開催の回（11:30・15:02）は計算だけで決まり、手動レースだけ1回問い合わせる
# あわせて、毎週金曜 14:30（日本時間）の宝くじの抽選も確かめる（worker.js の scheduled → runLotteryTick）
# 抽選時刻の直後以外の分は計算だけで終わり、Firestore には触れない
[triggers]
crons = ["* * * * *"]

# ログ（Cloudflare の管理画面の「Observability」と同じ設定）
[observability]
enabled = true

[observability.logs]
enabled = true
